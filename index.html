<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>カード面付けツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 左に操作パネル、右にA4プレビューを並べる作業台。スマホでは縦積み */
:root{
  --bg:#e9ecef; --surface:#ffffff; --ink:#18202c; --muted:#5d6878;
  --line:#d3d9e0; --accent:#0b72a8; --accent-ink:#ffffff; --accent-soft:#e2f0f8;
  --gold:#b8860b; --danger:#b3261e;
  --paper-shadow:0 1px 2px rgba(20,30,45,.12),0 8px 24px rgba(20,30,45,.10);
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --surface:#1b212a; --ink:#e6eaf0; --muted:#98a3b3;
  --line:#2c3440; --accent:#4bb0e6; --accent-ink:#0b1620; --accent-soft:#16303f;
  --gold:#e0b44a; --danger:#f2837a;
  --paper-shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --surface:#1b212a; --ink:#e6eaf0; --muted:#98a3b3;
  --line:#2c3440; --accent:#4bb0e6; --accent-ink:#0b1620; --accent-soft:#16303f;
  --gold:#e0b44a; --danger:#f2837a;
  --paper-shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:16px}
h1{font-size:1.5rem;margin:0;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.spec{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:861px){.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto}}
.label{font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:transparent;color:var(--ink);padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
.seg button+button{border-left:1px solid var(--line)}
.seg button b{font-size:.95rem}
.seg button span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px 12px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;font-size:1rem}
.drop small{color:var(--muted)}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,.drop:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rowh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;background:var(--surface);min-width:0}
.thumb{position:relative;aspect-ratio:63/88;max-width:100%;background:#fff;border:2px solid #000;overflow:hidden}
.thumb img.card{width:100%;height:100%;object-fit:contain;display:block}
.thumb img.logo{position:absolute;top:3%;right:3%;width:33.3%}
.num{position:absolute;left:0;top:0;background:rgba(0,0,0,.72);color:#fff;font-family:var(--f-mono);font-size:.7rem;padding:0 5px;border-bottom-right-radius:4px}
.ex{position:absolute;left:0;bottom:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:.68rem;text-align:center}
.psa{font:inherit;font-size:.78rem;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:3px 0;background:transparent;color:var(--muted);cursor:pointer}
.psa[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tools button{font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:5px;background:transparent;color:var(--ink);padding:1px 0;cursor:pointer}
.tools button:hover{border-color:var(--accent)}
.tools button.del:hover{border-color:var(--danger);color:var(--danger)}
.tools button:disabled{opacity:.3;cursor:default}
.note{border-left:4px solid var(--gold);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.85rem}
.note b{display:block;margin-bottom:2px}
.note ul{margin:4px 0 0;padding-left:1.2em}
.pages{display:flex;flex-direction:column;gap:24px;min-width:0}
.pagebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pagebar h2{font-size:1rem;margin:0}
.pagebar .meta{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.paper{width:100%;max-width:620px;aspect-ratio:210/297;box-shadow:var(--paper-shadow);background:#fff;display:block}
.paper canvas{width:100%;height:100%;display:block}
.allbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:.85rem;color:var(--muted);min-height:1.4em}
.fallback{position:fixed;inset:0;background:rgba(10,14,20,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.fallback .box{background:var(--surface);border-radius:10px;padding:16px;max-width:520px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.fallback img{width:100%;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>カード面付けツール</h1>
    <span class="spec" id="specLine"></span>
  </header>

  <div class="grid">
    <section class="panel" aria-label="設定">
      <div>
        <p class="label">モード</p>
        <div class="seg" role="group" aria-label="モード">
          <button id="modeSample" type="button" aria-pressed="true"><b>サンプルカード</b><span>63×88mm・9枚</span></button>
          <button id="modeTicket" type="button" aria-pressed="false"><b>オリパ引換券</b><span>47.25×66mm・16枚</span></button>
        </div>
      </div>

      <div>
        <p class="label">画像</p>
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="画像を追加">
          <strong>画像を追加</strong>
          <small>クリックして選択、またはドラッグ＆ドロップ（複数可）</small>
        </div>
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </div>

      <div>
        <div class="rowh" style="margin-bottom:8px">
          <p class="label" style="margin:0">配置順</p>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="count" id="countLine"></span>
            <button class="btn" id="clearAll" type="button" style="padding:3px 10px;font-size:.8rem">全て削除</button>
          </div>
        </div>
        <div class="list" id="list"></div>
      </div>

      <div class="note">
        <b>印刷するときの設定</b>
        <ul>
          <li>用紙：A4・縦</li>
          <li>倍率：<strong>実際のサイズ（100%）</strong></li>
          <li>「用紙に合わせる」「フチなし」はオフ</li>
        </ul>
      </div>
    </section>

    <section class="pages" aria-label="プレビュー">
      <div class="allbar">
        <button class="btn primary" id="saveAll" type="button">全ページを画像で保存</button>
        <span class="status" id="status" role="status"></span>
      </div>
      <div id="pages" class="pages"></div>
    </section>
  </div>
</div>

<div class="fallback" id="fallback" hidden>
  <div class="box">
    <div class="rowh"><strong id="fbTitle">画像を保存</strong><button class="btn" id="fbClose" type="button">閉じる</button></div>
    <p style="margin:0;font-size:.85rem">画像を右クリック（スマホは長押し）して「画像を保存」を選んでください。</p>
    <img id="fbImg" alt="保存用画像">
  </div>
</div>

const A4W = 210, A4H = 297, GAP = 1, BORDER = 1;
const DPI = 300, PXMM_FULL = DPI / 25.4;
const MODES = {
  sample: {name:"サンプルカード", file:"サンプルカード", w:63, h:88, cols:3, rows:3},
  ticket: {name:"オリパ引換券", file:"オリパ引換券", w:47.25, h:66, cols:4, rows:4}
};
let mode = "sample";
let items = []; // {id, img, url, psa, example}
let nextId = 1;
const logo = new Image();
logo.src = LOGO_SRC;

const $ = id => document.getElementById(id);
const dlPromise = (window.claude && typeof window.claude.use === "function") ? window.claude.use("downloads").catch(()=>null) : Promise.resolve(null);

function perPage(){ const m = MODES[mode]; return m.cols * m.rows; }
function layout(){
  const m = MODES[mode];
  const tw = m.cols*m.w + (m.cols-1)*GAP, th = m.rows*m.h + (m.rows-1)*GAP;
  return {m, ox:(A4W-tw)/2, oy:(A4H-th)/2, tw, th};
}

function renderPage(page, pxmm, canvas){
  const W = Math.round(A4W*pxmm), H = Math.round(A4H*pxmm);
  canvas.width = W; canvas.height = H;
  const c = canvas.getContext("2d");
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = "high";
  c.fillStyle = "#fff"; c.fillRect(0,0,W,H);
  const {m, ox, oy} = layout();
  const n = perPage();
  const P = v => v*pxmm;
  for(let i=0;i<n;i++){
    const it = items[page*n+i];
    if(!it) break;
    const col = i % m.cols, row = Math.floor(i / m.cols);
    const x = ox + col*(m.w+GAP), y = oy + row*(m.h+GAP);
    // 黒縁（縁込みでカードサイズ）
    c.fillStyle = "#000"; c.fillRect(P(x),P(y),P(m.w),P(m.h));
    const ix = x+BORDER, iy = y+BORDER, iw = m.w-2*BORDER, ih = m.h-2*BORDER;
    c.fillStyle = "#fff"; c.fillRect(P(ix),P(iy),P(iw),P(ih));
    // 画像（比率維持・余白は白）
    const img = it.img, r = Math.min(iw/img.naturalWidth, ih/img.naturalHeight);
    const dw = img.naturalWidth*r, dh = img.naturalHeight*r;
    c.save(); c.beginPath(); c.rect(P(ix),P(iy),P(iw),P(ih)); c.clip();
    c.drawImage(img, P(ix+(iw-dw)/2), P(iy+(ih-dh)/2), P(dw), P(dh));
    // PSA10ロゴ（右上・カード幅の1/3）
    if(it.psa && logo.complete && logo.naturalWidth){
      const lw = m.w/3, lh = lw*logo.naturalHeight/logo.naturalWidth, inset = m.w*0.025;
      c.drawImage(logo, P(ix+iw-inset-lw), P(iy+inset), P(lw), P(lh));
    }
    c.restore();
  }
  return canvas;
}

function pageCount(){ return Math.max(1, Math.ceil(items.length / perPage())); }

function renderAll(){
  const m = MODES[mode];
  const {tw, th, ox, oy} = layout();
  $("specLine").textContent = `A4縦・${m.w}×${m.h}mm × ${m.cols*m.rows}枚・間隔1mm・黒縁1mm・余白 左右${ox}mm 上下${oy}mm`;
  $("modeSample").setAttribute("aria-pressed", mode==="sample");
  $("modeTicket").setAttribute("aria-pressed", mode==="ticket");
  renderList();
  const host = $("pages"); host.innerHTML = "";
  const pc = pageCount();
  for(let p=0;p<pc;p++){
    const sec = document.createElement("div");
    const start = p*perPage()+1, end = Math.min(items.length,(p+1)*perPage());
    const bar = document.createElement("div"); bar.className = "pagebar";
    bar.innerHTML = `<div><h2>${p+1}ページ目</h2><span class="meta">${items.length? `No.${start}〜${end}（${end-start+1}枚）` : "画像なし"}・2480×3508px</span></div>`;
    const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = "このページを保存";
    b.disabled = !items.length;
    b.addEventListener("click", ()=>savePages([p]));
    bar.appendChild(b);
    const paper = document.createElement("div"); paper.className = "paper";
    const cv = document.createElement("canvas");
    renderPage(p, 3.4, cv);
    paper.appendChild(cv);
    sec.append(bar, paper);
    host.appendChild(sec);
  }
  $("saveAll").disabled = !items.length;
  $("saveAll").textContent = pc>1 ? `全${pc}ページを画像で保存` : "画像で保存";
}

function renderList(){
  const list = $("list"); list.innerHTML = "";
  const onlyEx = items.length && items.every(i=>i.example);
  $("countLine").textContent = items.length ? `${items.length}枚・${pageCount()}ページ` + (onlyEx?"（見本）":"") : "0枚";
  $("clearAll").disabled = !items.length;
  if(!items.length){
    const p = document.createElement("p"); p.style.cssText="margin:0;color:var(--muted);font-size:.85rem;grid-column:1/-1";
    p.textContent = "画像を追加すると、読み込んだ順に配置されます。"; list.appendChild(p); return;
  }
  items.forEach((it, idx)=>{
    const d = document.createElement("div"); d.className = "item";
    const th = document.createElement("div"); th.className = "thumb";
    const im = document.createElement("img"); im.className="card"; im.src = it.url; im.alt = `${idx+1}枚目`;
    th.appendChild(im);
    if(it.psa){ const lg = document.createElement("img"); lg.className="logo"; lg.src = LOGO_SRC; lg.alt = "PSA10"; th.appendChild(lg); }
    const num = document.createElement("span"); num.className="num"; num.textContent = idx+1; th.appendChild(num);
    if(it.example){ const ex = document.createElement("span"); ex.className="ex"; ex.textContent="見本"; th.appendChild(ex); }
    const psa = document.createElement("button"); psa.type="button"; psa.className="psa"; psa.id = `psa-${it.id}`;
    psa.setAttribute("aria-pressed", it.psa); psa.textContent = it.psa ? "PSA10 ON" : "PSA10";
    psa.addEventListener("click", ()=>{ it.psa = !it.psa; renderAll(); });
    const tools = document.createElement("div"); tools.className="tools";
    const mk = (t, label, fn, dis, cls) => { const b=document.createElement("button"); b.type="button"; b.textContent=t; b.setAttribute("aria-label",label); b.disabled=dis; if(cls) b.className=cls; b.addEventListener("click",fn); return b; };
    tools.append(
      mk("←", "前へ", ()=>move(idx,-1), idx===0),
      mk("→", "後ろへ", ()=>move(idx,1), idx===items.length-1),
      mk("×", "削除", ()=>remove(idx), false, "del")
    );
    d.append(th, psa, tools); list.appendChild(d);
  });
}

function move(i, dir){ const j=i+dir; [items[i],items[j]]=[items[j],items[i]]; renderAll(); }
function remove(i){ const [it]=items.splice(i,1); if(it && !it.example) URL.revokeObjectURL(it.url); renderAll(); }

function loadImage(url){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; }); }

async function addFiles(files){
  const list = [...files].filter(f=>f.type.startsWith("image/"));
  if(!list.length){ setStatus("画像ファイルを選んでください。"); return; }
  if(items.some(i=>i.example)) items = items.filter(i=>!i.example);
  let failed = 0;
  for(const f of list){
    const url = URL.createObjectURL(f);
    try{ const img = await loadImage(url); items.push({id:nextId++, img, url, psa:false, example:false}); }
    catch(e){ URL.revokeObjectURL(url); failed++; }
  }
  renderAll();
  setStatus(failed ? `${failed}件の画像を読み込めませんでした。` : `${list.length}枚追加しました。`);
}

function setStatus(t){ $("status").textContent = t; }

// ---- PNGに300dpi情報を書き込む（印刷時に実寸で出るように） ----
const CRC = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(bytes){ let c=0xFFFFFFFF; for(const b of bytes) c = CRC[(c^b)&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
async function withDpi(blob){
  const src = new Uint8Array(await blob.arrayBuffer());
  const ppm = Math.round(DPI/0.0254);
  const chunk = new Uint8Array(21); const dv = new DataView(chunk.buffer);
  dv.setUint32(0, 9); chunk.set([0x70,0x48,0x59,0x73], 4);
  dv.setUint32(8, ppm); dv.setUint32(12, ppm); chunk[16] = 1;
  dv.setUint32(17, crc32(chunk.subarray(4,17)));
  const out = new Uint8Array(src.length + 21);
  out.set(src.subarray(0,33)); out.set(chunk,33); out.set(src.subarray(33), 54);
  return new Blob([out], {type:"image/png"});
}
function toBlob(cv){ return new Promise(r=>cv.toBlob(r,"image/png")); }

async function makePng(p){
  const cv = document.createElement("canvas");
  renderPage(p, PXMM_FULL, cv);
  const b = await toBlob(cv);
  cv.width = cv.height = 0;
  return withDpi(b);
}

async function savePages(pages){
  if(!items.length) return;
  const m = MODES[mode];
  const dl = await dlPromise;
  for(const p of pages){
    setStatus(`${p+1}ページ目を作成中…`);
    const blob = await makePng(p);
    const filename = `${m.file}_${p+1}.png`;
    if(dl){
      try{ await dl.save({filename, data: blob}); setStatus(`${filename} を保存しました。`); }
      catch(e){
        if(e && e.code==="declined"){ setStatus("保存をキャンセルしました。"); return; }
        if(e && e.code==="rate_limited"){ setStatus("保存確認が開いています。閉じてからもう一度押してください。"); return; }
        showFallback(blob, filename); return;
      }
    } else if(!window.claude){ const a=document.createElement("a"); const u=URL.createObjectURL(blob); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000); setStatus(`${filename} を保存しました。`); await new Promise(r=>setTimeout(r,400));
    } else { showFallback(blob, filename); if(pages.length>1) setStatus("このページを保存したら、閉じると次のページが表示されます。"); await waitClose(); }
  }
}
let closeResolver = null;
function showFallback(blob, name){
  const img = $("fbImg"); if(img.src) URL.revokeObjectURL(img.src);
  img.src = URL.createObjectURL(blob); $("fbTitle").textContent = name; $("fallback").hidden = false;
  setStatus("");
}
function waitClose(){ return new Promise(r=>{ closeResolver = r; }); }
$("fbClose").addEventListener("click", ()=>{ $("fallback").hidden = true; if(closeResolver){ const r=closeResolver; closeResolver=null; r(); } });

// ---- 見本画像（起動時の表示用） ----
function makeExample(n, hue){
  const cv = document.createElement("canvas"); cv.width=630; cv.height=880;
  const c = cv.getContext("2d");
  const g = c.createLinearGradient(0,0,630,880);
  g.addColorStop(0,`hsl(${hue},70%,62%)`); g.addColorStop(1,`hsl(${hue+40},65%,38%)`);
  c.fillStyle=g; c.fillRect(0,0,630,880);
  c.fillStyle="rgba(255,255,255,.9)"; c.fillRect(50,120,530,380);
  c.fillStyle=`hsl(${hue},40%,30%)`; c.font="bold 150px sans-serif"; c.textAlign="center"; c.textBaseline="middle";
  c.fillText("見本", 315, 310);
  c.fillStyle="#fff"; c.font="bold 64px sans-serif"; c.fillText(`No.${n}`, 315, 640);
  c.font="36px sans-serif"; c.fillText("ここにカード画像", 315, 740);
  return cv.toDataURL("image/png");
}
async function seed(){
  const hues=[200,20,120,280,50];
  for(let i=0;i<5;i++){
    const url = makeExample(i+1, hues[i]);
    const img = await loadImage(url);
    items.push({id:nextId++, img, url, psa: i===0 || i===3, example:true});
  }
  renderAll();
}

// ---- イベント ----
$("modeSample").addEventListener("click", ()=>{ mode="sample"; renderAll(); });
$("modeTicket").addEventListener("click", ()=>{ mode="ticket"; renderAll(); });
const drop = $("drop"), input = $("fileInput");
drop.addEventListener("click", ()=>input.click());
drop.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); input.click(); } });
input.addEventListener("change", ()=>{ addFiles(input.files); input.value=""; });
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev, e=>{ e.preventDefault(); if(ev==="drop"||e.target===document.documentElement) drop.classList.remove("over"); }));
document.addEventListener("drop", e=>{ if(e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
$("clearAll").addEventListener("click", ()=>{ items.forEach(i=>{ if(!i.example) URL.revokeObjectURL(i.url); }); items=[]; renderAll(); setStatus(""); });
$("saveAll").addEventListener("click", ()=>savePages([...Array(pageCount()).keys()]));

logo.onload = ()=>renderAll();
renderAll();
seed();
})();
</script>
